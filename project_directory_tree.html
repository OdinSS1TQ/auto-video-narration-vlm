const ICONS = {
  dir: "📁",
  py: "🐍", ipynb: "📓", yaml: "⚙️", md: "📄",
  sh: "🔧", txt: "📋", env: "🔑", toml: "⚙️",
  gitignore: "🚫", gitkeep: "📌", dockerfile: "🐳",
  default: "📄"
};

function getIcon(node) {
  if (node.type === "dir") return ICONS.dir;
  const ext = node.name.split(".").pop().toLowerCase();
  if (node.name === "Dockerfile") return ICONS.dockerfile;
  if (node.name === ".gitignore") return ICONS.gitignore;
  if (node.name === ".gitkeep") return ICONS.gitkeep;
  if (node.name.startsWith(".env")) return ICONS.env;
  return ICONS[ext] || ICONS.default;
}

function renderTree(nodes, depth, container) {
  nodes.forEach(node => {
    const wrap = document.createElement("div");

    const row = document.createElement("div");
    row.className = "node";

    // indentation pipes
    for (let i = 0; i < depth; i++) {
      const ind = document.createElement("div");
      ind.className = "indent";
      const pipe = document.createElement("div");
      pipe.className = "pipe";
      const line = document.createElement("div");
      line.className = "pipe-line";
      pipe.appendChild(line);
      ind.appendChild(pipe);
      row.appendChild(ind);
    }

    // toggle
    const tog = document.createElement("div");
    tog.className = "toggle " + (node.children ? "open" : "leaf");
    tog.textContent = "▶";
    row.appendChild(tog);

    // label
    const lbl = document.createElement("div");
    lbl.className = "label";

    const ico = document.createElement("span");
    ico.className = "icon";
    ico.textContent = getIcon(node);
    lbl.appendChild(ico);

    const nm = document.createElement("span");
    nm.className = "name" + (node.type === "dir" ? " dir" : "");
    nm.textContent = node.name;
    lbl.appendChild(nm);

    if (node.badge) {
      const b = document.createElement("span");
      b.className = "badge badge-" + node.badge[0];
      b.textContent = node.badge[1];
      lbl.appendChild(b);
    }

    if (node.comment) {
      const cmt = document.createElement("span");
      cmt.className = "comment";
      cmt.textContent = "— " + node.comment;
      lbl.appendChild(cmt);
    }

    row.appendChild(lbl);
    wrap.appendChild(row);

    if (node.children) {
      const childContainer = document.createElement("div");
      childContainer.className = "children";
      renderTree(node.children, depth + 1, childContainer);
      wrap.appendChild(childContainer);

      row.style.cursor = "pointer";
      tog.addEventListener("click", e => {
        e.stopPropagation();
        const open = !childContainer.classList.contains("hidden");
        childContainer.classList.toggle("hidden", open);
        tog.classList.toggle("open", !open);
      });
      lbl.addEventListener("click", () => tog.click());
    }

    container.appendChild(wrap);
  });
}
