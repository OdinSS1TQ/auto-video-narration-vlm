# Local VLM model configuration
#
# Default: Qwen3.5-0.8B (compact, ~1.6GB VRAM)
# Legacy:  Qwen2.5-VL-3B  (dedicated VLM, ~6GB VRAM)

# ── Active model ──────────────────────────────────
model:
  path: ./models/qwen3.5-2b
  description: "Qwen3.5-2B — multimodal VLM (262K context, ~4GB VRAM)"

inference:
  context_length: 32768
  temperature: 0.2
  max_tokens: 4096
  repeat_penalty: 1.1

# Memory optimization
memory:
  max_batch_size: 1
  offload_kv_cache: false
  flash_attention: true

# ── Legacy: Qwen2.5-VL-3B ────────────────────────
# Uncomment below and comment above to switch back:
#
# model:
#   path: ./models/qwen2.5-vl-3b
#   description: "Qwen2.5-VL-3B — dedicated VLM (~6GB VRAM)"
#   quantization: Q4_K_M       # only for GGUF variants
#   n_gpu_layers: 35            # adjust per VRAM (8GB: ~35)
#
# inference:
#   context_length: 8192
#   temperature: 0.2
#   max_tokens: 4096
#   repeat_penalty: 1.1
#
# memory:
#   max_batch_size: 1
#   offload_kv_cache: false
#   flash_attention: true
